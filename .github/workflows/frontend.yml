name: Frontend CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run all Playwright tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format branch
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.format.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format and push branch changes
        id: format
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH" || true)
          bash .github/scripts/format-changed.sh --write "$base"

          if ! git diff --quiet; then
            git add -u
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: apply Prettier formatting'
            git push --force-with-lease="$GITHUB_REF:$GITHUB_SHA" origin "HEAD:$GITHUB_REF"
          fi

          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: Format, lint, build and browser tests
    needs: format
    if: ${{ !cancelled() && !github.event.deleted && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_API_BASE_URL: /api/v1
      VITE_WS_URL: /ws
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.format.outputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check changed files with Prettier
        if: needs.format.result == 'skipped'
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash .github/scripts/format-changed.sh --check "$FORMAT_BASE"

      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium

      - name: Test guest access, menu administration and branch staff
        if: github.event_name != 'workflow_dispatch' || !inputs.full_browser_suite
        run: npm run test:qr -- --workers=2 guest-access.spec.ts admin-menu-management.spec.ts branch-staff.spec.ts

      - name: Run all Playwright tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser_suite
        run: npm run test:qr -- --workers=2

      - name: Upload failed browser test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  publish:
    name: Publish frontend image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: restaurant-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: |
          docker build --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Smoke test Nginx
        run: |
          container=$(docker run --detach --publish 127.0.0.1::80 "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          address=$(docker port "$container" 80/tcp)
          test "$(curl --fail --silent --show-error --retry 10 --retry-all-errors --max-time 5 "http://$address/healthz")" = ok
          curl --fail --silent --show-error "http://$address/" --output "$RUNNER_TEMP/frontend-index.html"
          curl --fail --silent --show-error "http://$address/login" --output "$RUNNER_TEMP/frontend-login.html"
          cmp "$RUNNER_TEMP/frontend-index.html" "$RUNNER_TEMP/frontend-login.html"

      - name: Push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$registry_image:sha-$GITHUB_SHA"
          docker tag "$IMAGE" "$registry_image:latest"
          docker push "$registry_image:sha-$GITHUB_SHA"
          docker push "$registry_image:latest"

  deploy:
    name: Deploy frontend to Docker Compose
    needs: publish
    if: github.event.repository.private && vars.RESTAURANT_BACKEND_DIR != ''
    runs-on: [self-hosted, Windows, restaurant-frontend-deploy]
    timeout-minutes: 10
    env:
      RESTAURANT_BACKEND_DIR: ${{ vars.RESTAURANT_BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Pull and start frontend
        shell: powershell
        run: |
          $image = 'ghcr.io/{0}:sha-{1}' -f $env:GITHUB_REPOSITORY.ToLowerInvariant(), $env:GITHUB_SHA
          & .\deploy\deploy-frontend.ps1 -BackendDirectory $env:RESTAURANT_BACKEND_DIR -Image $image
