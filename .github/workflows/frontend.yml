name: Frontend CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Run all Playwright tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, build and browser tests
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_API_BASE_URL: /api/v1
      VITE_WS_URL: /ws
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check changed files with Prettier
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bash .github/scripts/format-changed.sh --check "$FORMAT_BASE"

      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium

      - name: Test guest access, menu administration and branch staff
        if: github.event_name != 'workflow_dispatch' || !inputs.full_browser_suite
        run: npm run test:qr -- --workers=2 guest-access.spec.ts admin-menu-management.spec.ts branch-staff.spec.ts

      - name: Run all Playwright tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser_suite
        run: npm run test:qr -- --workers=2

      - name: Upload failed browser test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
