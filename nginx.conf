map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Re-resolve the backend after Docker replaces its container/IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location ^~ /api/ {
        # Preserve the API prefix and query string expected by Spring controllers.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        # Defining headers in a location overrides inherited proxy_set_header values.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location = /index.html {
        add_header Cache-Control 'no-cache';
    }

    location / {
        # Support refreshing a client-side React Router URL.
        try_files $uri $uri/ /index.html;
    }
}
